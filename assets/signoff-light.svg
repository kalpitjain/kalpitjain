<text class="rise" style="animation-delay:0.05s" x="500.0" y="86" font-size="20" font-style="italic" text-anchor="middle" fill="#1f2328">The best solutions come from understanding the world beyond the screen.</text>
<text class="rise" style="animation-delay:0.15s" x="500.0" y="114" font-size="13" text-anchor="middle" fill="#59636e">— Kalpit Jain</text>
</svg>
