<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" fill="none">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
@keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(70px, 30px); } }
@keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-80px, -25px); } }
.rise { opacity: 0; animation: rise .7s cubic-bezier(.25,.46,.45,.94) forwards; }
.fade { opacity: 0; animation: fade .5s ease-out forwards; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
.d1 { animation: drift1 14s ease-in-out infinite; }
.d2 { animation: drift2 17s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .rise, .fade { opacity: 1; }
}
</style>
<defs>
<linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="rgba(59,130,246,0.045)"/><stop offset="1" stop-color="rgba(59,130,246,0.012)"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#3b82f6" stop-opacity=".5"/>
  <stop offset=".45" stop-color="rgba(31,35,40,0.12)"/>
  <stop offset="1" stop-color="rgba(31,35,40,0.12)"/>
</linearGradient>
<radialGradient id="glow" cx="0" cy="0" r="1">
  <stop offset="0" stop-color="#3b82f6" stop-opacity="0.12"/>
  <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow-br" cx="1" cy="1" r="1">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
  <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#1d4ed8"/><stop offset="1" stop-color="#3b82f6"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="880 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<rect x="0.0" y="0.0" width="1000.0" height="150.0" rx="20" fill="url(#fill)"/><rect x="0.0" y="0.0" width="1000.0" height="150.0" rx="20" fill="url(#glow)"/><rect x="0.5" y="0.5" width="999.0" height="149.0" rx="19.5" stroke="url(#edge)"/>
<rect width="1000" height="150" rx="20" fill="url(#glow-br)"/>
<g transform="translate(486.0 26.0) scale(1.1666666666666667)" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/></g>
<text class="rise" style="animation-delay:0.10s" x="500.0" y="92" font-size="21" font-style="italic" text-anchor="middle" fill="#121826">The best solutions come from understanding the world beyond the screen.</text>
<text class="mono rise" style="animation-delay:0.22s" x="500.0" y="124" font-size="12" letter-spacing="2" text-anchor="middle" fill="#58606f">— KALPIT JAIN</text>
</svg>
