<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" fill="none">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
.rise { opacity: 0; animation: rise .6s cubic-bezier(.25,.46,.45,.94) forwards; }
.fade { opacity: 0; animation: fade .5s ease-out forwards; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .rise, .fade { opacity: 1; }
}
</style>
<defs></defs>
<rect x="0.5" y="0.5" width="999.0" height="139.0" rx="12" fill="rgba(208,215,222,0.08)" stroke="#d1d9e0"/>
