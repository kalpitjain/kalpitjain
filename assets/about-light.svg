  <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow-br" cx="1" cy="1" r="1">
  <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
  <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#1d4ed8"/><stop offset="1" stop-color="#3b82f6"/>
