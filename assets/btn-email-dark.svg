<svg xmlns="http://www.w3.org/2000/svg" width="99" height="40" viewBox="0 0 99 40" fill="none">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
.rise { opacity: 0; animation: rise .6s cubic-bezier(.25,.46,.45,.94) forwards; }
.fade { opacity: 0; animation: fade .5s ease-out forwards; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .rise, .fade { opacity: 1; }
}
</style>
<defs></defs>
<rect x=".5" y=".5" width="98" height="39" rx="8" fill="#212830" stroke="#3d444d"/><g transform="translate(16.0 12.0) scale(0.6666666666666666)" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></g><text x="42" y="25" font-size="14" font-weight="600" fill="#f0f6fc">Email</text>
</svg>
